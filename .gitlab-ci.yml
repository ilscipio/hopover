# Hopover meeting point: test, build and run the container on 10.0.1.159 itself.
# The job runs on the shell runner "hopover" registered on that host (tag: hopover),
# so it needs no SSH key and no registry. Caddy proxies hop.ilscipio.com:80 to it.
stages:
  - deploy

deploy-rendezvous:
  stage: deploy
  script:
    - sudo docker run --rm -v "$CI_PROJECT_DIR/rendezvous:/src" -w /src golang:1.22-alpine go test ./...
    - sudo docker build -t "hopover-rendezvous:$CI_COMMIT_SHORT_SHA" -t hopover-rendezvous:latest rendezvous
    - sudo docker rm -f hopover-rendezvous || true
    - sudo docker run -d --name hopover-rendezvous --restart=always -p 192.168.32.1:47900:47900 "hopover-rendezvous:$CI_COMMIT_SHORT_SHA"
    - sleep 2
    - 'curl -fsS -H "Host: hop.ilscipio.com" http://127.0.0.1/v1/ping'
  rules:
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
      changes:
        - rendezvous/**/*
        - .gitlab-ci.yml
  environment:
    name: production
  tags:
    - hopover
