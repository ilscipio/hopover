# Builds Hopover.exe on every change that reaches it, runs the link selftest and publishes the exe as a release.
# The repo on GitHub is a mirror of GitLab: change the code there. Stable link:
# https://github.com/ilscipio/hopover/releases/latest/download/Hopover.exe
name: Release the exe

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'lib/**'
      - 'config/**'
      - 'hopover.ps1'
      - 'build.ps1'
      - '.github/workflows/release.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: powershell
        run: .\build.ps1

      - name: Selftest
        shell: powershell
        run: |
          $p = Start-Process -FilePath dist\Hopover.exe -ArgumentList '--link','selftest' -Wait -PassThru -NoNewWindow -RedirectStandardOutput selftest.txt
          Get-Content selftest.txt
          if ($p.ExitCode -ne 0) { throw "selftest failed (exit $($p.ExitCode))" }

      - name: Publish
        shell: powershell
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $sha = $env:GITHUB_SHA.Substring(0, 7)
          # A plain version number: winget compares versions.
          $tag = "v1.0.$env:GITHUB_RUN_NUMBER"
          gh release create $tag dist\Hopover.exe --title "Hopover $tag" --notes "Built from $sha. The exe is not signed: Windows SmartScreen asks once (More info, Run anyway)." --latest
          if ($LASTEXITCODE -ne 0) { throw 'gh release failed' }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding ascii
        id: publish

      # A new release also goes to winget. Needs the repo secret WINGET_TOKEN (a GitHub token with public_repo)
      # and the package in the catalog: without them this step says so and the release still stands.
      - name: Update winget
        shell: powershell
        continue-on-error: true
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if (-not $env:WINGET_TOKEN) { Write-Host 'No WINGET_TOKEN secret: winget stays as it is.'; exit 0 }
          $url = "https://github.com/ilscipio/hopover/releases/download/$env:TAG/Hopover.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe -UseBasicParsing
          .\wingetcreate.exe update Ilscipio.Hopover --version $env:TAG.TrimStart('v') --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed (exit $LASTEXITCODE)" }
